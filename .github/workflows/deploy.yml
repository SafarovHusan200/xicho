name: Deploy

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /home/xicho
          git fetch origin dev
          git reset --hard origin/dev

      - name: Install dependencies
        run: cd /home/xicho && npm ci

      - name: Build
        run: cd /home/xicho && npm run build

      - name: Restart app
        run: pm2 restart xicho
